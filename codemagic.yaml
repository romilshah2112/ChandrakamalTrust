# Required in Codemagic apple_credentials group:
# CERTIFICATE_PRIVATE_KEY = paste full content of ios_distribution.key (including -----BEGIN/END-----)
# If newlines are lost, use \n between lines: -----BEGIN PRIVATE KEY-----\nMIGT...\n-----END PRIVATE KEY-----
workflows:
  ios-workflow:
    name: iOS Build

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      groups:
        - apple_credentials

    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          flutter pub get

      - name: Generate launcher icons
        script: |
          cd mobile
          dart run flutter_launcher_icons

      - name: Pod install
        script: |
          cd mobile/ios
          pod install

      - name: Fetch signing files and set up code signing
        script: |
          keychain initialize
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY not set. Add it to apple_credentials group."
            exit 1
          fi
          printf '%b' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files com.scdinsight.app --type IOS_APP_STORE --create \
            --certificate-key @file:/tmp/cert_key.pem \
            --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles" \
            --certificates-dir "$HOME/Library/MobileDevice/Certificates"
          keychain add-certificates
          cd frontend
          xcode-project use-profiles --project ios/Runner.xcodeproj --archive-method app-store --warn-only || true
          PROFILE_FILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            echo "ERROR: No provisioning profile found. Check fetch-signing-files output above."
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true
            exit 1
          fi
          security cms -D -i "$PROFILE_FILE" > /tmp/profile.plist 2>/dev/null
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist 2>/dev/null)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null)
          echo "Profile: $PROFILE_NAME (UUID: $PROFILE_UUID)"
          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Could not extract profile UUID"
            exit 1
          fi
          sed -i.bak "s/__CI_PROFILE_UUID__/$PROFILE_UUID/g" ios/Runner.xcodeproj/project.pbxproj
          cp ios/ExportOptions.plist $HOME/export_options.plist
          [ -n "$PROFILE_NAME" ] && /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.scdinsight.app \"$PROFILE_NAME\"" $HOME/export_options.plist 2>/dev/null || true

      - name: Build IPA
        script: |
          cd frontend
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=https://chandrakamaltrust-production.up.railway.app \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
